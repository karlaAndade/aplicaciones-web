<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuenta regresiva FOR</title>
</head>
<body>

<script type="text/javascript">

    var countdown = prompt("Introduce un número para iniciar la cuenta atrás:");

    for (countdown; countdown > 0; countdown--) {

        alert(countdown + " ... ");

    }

</script>

</body>
</html>
